name: train_away
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: lib/screens/fecha_reserva/tipografia/DMSans-Medium.ttf
          weight: 500
        - asset: lib/screens/fecha_reserva/tipografia/DMSans-Bold.ttf
          weight: 700
    - family: Corinthia
      fonts:
        - asset: lib/screens/fecha_reserva/tipografia/Corinthia-Bold.ttf
          weight: 700
